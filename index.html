<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินคำนวณธาตุและจักรราศีกำเนิด/ปฏิสนธิ</title>
    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body { background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; border-bottom: 3px solid #dbb234; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        input[type="date"], input[type="time"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-item { display: flex; align-items: center; gap: 5px; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { width: 100%; background-color: #dbb234; color: #2c3e50; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
        button:hover { background-color: #c29d2b; }
        .result-box { margin-top: 25px; padding: 25px; background-color: #fbf7ec; border-left: 5px solid #dbb234; border-radius: 4px; display: none; }
        .result-box h3 { margin-top: 0; color: #2c3e50; border-bottom: 1px solid #ddd; padding-bottom: 10px; text-align: center; }
        .pattern-output { font-size: 18px; color: #2c3e50; line-height: 2; background: #ffffff; padding: 15px; border-radius: 6px; border: 1px dashed #dbb234; }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินคำนวณจักรราศีและธาตุ</h2>
    <form id="quizForm">
        <div class="form-group">
            <label for="birthDate">A) วัน เดือน ปี เกิด (ค.ศ.):</label>
            <input type="date" id="birthDate" required>
        </div>
        <div class="form-group">
            <label>B) คุณเกิดก่อนเวลา 06:00 น. ใช่หรือไม่?</label>
            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="before6Yes" name="before6" value="yes" required>
                    <label for="before6Yes">ใช่ (ก่อน 06:00 น.)</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="before6No" name="before6" value="no" required>
                    <label for="before6No">ไม่ใช่ / ไม่แน่ใจ</label>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label for="birthTime">C) เวลาเกิดของคุณ (โดยประมาณ):</label>
            <input type="time" id="birthTime">
        </div>
        <div class="form-group">
            <label>D) ระยะเวลาที่อยู่ในครรภ์มารดา:</label>
            <div class="row">
                <div class="col">
                    <label style="font-size:12px; font-weight:normal;">จำนวนเดือน:</label>
                    <input type="number" id="gestationMonths" placeholder="เช่น 9" min="0" max="12" step="0.1" value="9" required>
                </div>
                <div class="col">
                    <label style="font-size:12px; font-weight:normal;">จำนวนวัน:</label>
                    <input type="number" id="gestationDays" placeholder="เช่น 0" min="0" max="31" value="0">
                </div>
            </div>
        </div>
        <button type="button" onclick="processQuiz()">วิเคราะห์ผลลัพธ์</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>ผลการวิเคราะห์ทางโหราศาสตร์</h3>
        <div class="pattern-output" id="patternResult"></div>
    </div>
</div>

<script>
// รายชื่อปีอธิกมาส (มีเดือน 8 สองหน) ตามมาตรฐานหลวงที่ MyHora ใช้จริงเพื่อคำนวณทดวันจันทรคติ
const ATHIKAMAS_YEARS = [1956, 1959, 1962, 1964, 1967, 1970, 1972, 1975, 1977, 1980, 1983, 1985, 1988, 1991, 1993, 1996, 1999, 2001, 2004, 2007, 2009, 2012, 2015, 2017, 2020, 2023, 2026];

const ZODIAC_ORDER = ["ราศีมังกร", "ราศีกุมภ์", "ราศีมีน", "ราศีเมษ", "ราศีพฤษภ", "ราศีเมถุน", "ราศีกรกฎ", "ราศีสิงห์", "ราศีกันย์", "ราศีตุล", "ราศีพิจิก", "ราศีธนู"];
const ELEMENT_MAP = { "ราศีมังกร": "ธาตุดิน", "ราศีกุมภ์": "ธาตุดิน", "ราศีมีน": "ธาตุดิน", "ราศีเมษ": "ธาตุไฟ", "ราศีพฤษภ": "ธาตุไฟ", "ราศีเมถุน": "ธาตุไฟ", "ราศีกรกฎ": "ธาตุลม", "ราศีสิงห์": "ธาตุลม", "ราศีกันย์": "ธาตุลม", "ราศีตุล": "ธาตุน้ำ", "ราศีพิจิก": "ธาตุน้ำ", "ราศีธนู": "ธาตุน้ำ" };

// 1. ฟังก์ชันคำนวณหา ขึ้น/แรม และเดือนจันทรคติไทยแท้ (Dynamic Engine)
function calculateThaiLunar(dateObj) {
    const baseDate = new Date(1976, 3, 15); // วันขึ้น 15 ค่ำ เดือน 5 ปีมะโรง (หมุดอ้างอิงหลัก)
    const diffDays = Math.floor((dateObj - baseDate) / (1000 * 60 * 60 * 24));
    const synodicMonth = 29.530589;
    const elapsedMonths = diffDays / synodicMonth;
    
    let currentKham = Math.round((elapsedMonths - Math.floor(elapsedMonths)) * synodicMonth);
    if (currentKham <= 0) currentKham += 30;
    if (currentKham > 30) currentKham -= 30;
    
    let phase = "ขึ้น";
    let displayKham = currentKham;
    if (currentKham > 15) { 
        phase = "แรม"; 
        displayKham = currentKham - 15; 
    }

    let sMonth = dateObj.getMonth() + 1;
    let sYear = dateObj.getFullYear();
    let sDate = dateObj.getDate();
    
    // ตั้งต้นจับคู่เดือนจันทรคติไทยเบดเสร็จ (เช่น มกราคม = เดือน 2)
    let thaiMonth = sMonth + 1;
    if (thaiMonth > 12) thaiMonth -= 12;

    // ชดเชยปีอธิกมาส (เดือน 8 สองหน) เพื่อไล่เดือนให้ตรงกับ MyHora
    if (ATHIKAMAS_YEARS.includes(sYear)) {
        if (sMonth === 6) thaiMonth = 8; // เดือน 8 แรก
        else if (sMonth === 7) thaiMonth = 8; // เดือน 8 หลัง
        else if (sMonth > 7) { 
            thaiMonth = sMonth + 2; 
            if (thaiMonth > 12) thaiMonth -= 12; 
        }
    } else {
        // ปีปกติมาส เช่น 2525 ปลายเดือนกรกฎาคมจะเข้าสู่เดือน 9 จันทรคติ
        if (sMonth === 7 && sDate >= 22) {
            thaiMonth = 9;
        }
    }
    return { phase: phase, kham: displayKham, thaiMonth: thaiMonth, rawKham: currentKham };
}

// 2. ฟังก์ชันจับจักรราศีและธาตุ ตามเงื่อนไขจันทรคติเวชกรรมไทย (แรม 1 ค่ำ เดือน 4 ถึง ขึ้น 15 ค่ำ เดือน 5 = ราศีเมษ)
function getThaiZodiacByLunar(thaiMonth, phase, kham, rawKham) {
    // แปลงให้เป็นระบบ "วันสัมพัทธ์ในเดือน" เพื่อให้ไล่เงื่อนไขง่ายขึ้น
    // ขึ้น 1-15 ค่ำ คือค่า 1-15 | แรม 1-15 ค่ำ คือค่า 16-30
    
    // ลอจิกตรวจสอบตามที่คุณกำหนดเรียงกันไปทั้ง 12 ราศี
    if ((thaiMonth === 4 && phase === "แรม") || (thaiMonth === 5 && phase === "ขึ้น")) {
        return { sign: "ราศีเมษ", element: "ธาตุไฟ" };
    }
    if ((thaiMonth === 5 && phase === "แรม") || (thaiMonth === 6 && phase === "ขึ้น")) {
        return { sign: "ราศีพฤษภ", element: "ธาตุไฟ" };
    }
    if ((thaiMonth === 6 && phase === "แรม") || (thaiMonth === 7 && phase === "ขึ้น")) {
        return { sign: "ราศีเมถุน", element: "ธาตุไฟ" };
    }
    if ((thaiMonth === 7 && phase === "แรม") || (thaiMonth === 8 && phase === "ขึ้น")) {
        return { sign: "ราศีกรกฎ", element: "ธาตุลม" };
    }
    if ((thaiMonth === 8 && phase === "แรม") || (thaiMonth === 9 && phase === "ขึ้น")) {
        return { sign: "ราศีสิงห์", element: "ธาตุลม" };
    }
    if ((thaiMonth === 9 && phase === "แรม") || (thaiMonth === 10 && phase === "ขึ้น")) {
        return { sign: "ราศีกันย์", element: "ธาตุลม" };
    }
    if ((thaiMonth === 10 && phase === "แรม") || (thaiMonth === 11 && phase === "ขึ้น")) {
        return { sign: "ราศีตุล", element: "ธาตุน้ำ" };
    }
    if ((thaiMonth === 11 && phase === "แรม") || (thaiMonth === 12 && phase === "ขึ้น")) {
        return { sign: "ราศีพิจิก", element: "ธาตุน้ำ" };
    }
    if ((thaiMonth === 12 && phase === "แรม") || (thaiMonth === 1 && phase === "ขึ้น")) {
        return { sign: "ราศีธนู", element: "ธาตุน้ำ" };
    }
    if ((thaiMonth === 1 && phase === "แรม") || (thaiMonth === 2 && phase === "ขึ้น")) {
        return { sign: "ราศีมังกร", element: "ธาตุดิน" };
    }
    if ((thaiMonth === 2 && phase === "แรม") || (thaiMonth === 3 && phase === "ขึ้น")) {
        return { sign: "ราศีกุมภ์", element: "ธาตุดิน" };
    }
    if ((thaiMonth === 3 && phase === "แรม") || (thaiMonth === 4 && phase === "ขึ้น")) {
        return { sign: "ราศีมีน", element: "ธาตุดิน" };
    }

    // กรณีปัดเศษสำรอง ป้องกันค่าหลุดลูป
    return { sign: "ราศีสิงห์", element: "ธาตุลม" };
}

function processQuiz() {
    const birthDateInput = document.getElementById('birthDate').value;
    const before6 = document.querySelector('input[name="before6"]:checked')?.value;
    const birthTime = document.getElementById('birthTime').value;
    let gMonths = parseFloat(document.getElementById('gestationMonths').value) || 9;
    let gDays = parseInt(document.getElementById('gestationDays').value) || 0;

    if (!birthDateInput || !before6) { alert("กรุณาระบุข้อมูลให้ครบถ้วน"); return; }

    let birthDate = new Date(birthDateInput);
    
    // ตรรกะตรวจเช็กเวลาเกิดก่อน 6 โมงเช้าเพื่อถอยวันตามหลักโหราศาสตร์ไทย
    let isAdjustedDay = false;
    if (birthTime !== "") {
        const timeParts = birthTime.split(":");
        if (parseInt(timeParts[0]) < 6) isAdjustedDay = true;
    } else if (before6 === 'yes') {
        isAdjustedDay = true;
    }

    if (isAdjustedDay) { birthDate.setDate(birthDate.getDate() - 1); }

    const dayNames = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
    const thaiZodiacs = ["ปีมะเมีย", "ปีมะแม", "ปีวอก", "ปีระกา", "ปีจอ", "ปีกุน", "ปีชวด", "ปีฉลู", "ปีขาล", "ปีเถาะ", "ปีมะโรง", "ปีมะเส็ง"];
    
    let dayName = dayNames[birthDate.getDay()];
    let zodiacYearStr = thaiZodiacs[(birthDate.getFullYear() - 4) % 12];

    // คำนวณดิถีจันทรคติ
    const lunar = calculateThaiLunar(birthDate);

    // คำนวณจักรราศีและธาตุกำเนิดล้อตามระบบ ขึ้น/แรม และเดือนไทยที่คุณกำหนด
    const birthZodiacObj = getThaiZodiacByLunar(lunar.thaiMonth, lunar.phase, lunar.kham, lunar.rawKham);
    let birthZodiac = birthZodiacObj.sign;
    let birthElement = birthZodiacObj.element;

    // คำนวณธาตุปฏิสนธิย้อนหลังอย่างยืดหยุ่นตามอายุครรภ์จริง ด้วยการหมุนจักรราศีถอยหลัง
    let totalGestationMonths = gMonths + (gDays / 30);
    let monthShift = Math.round(12 - totalGestationMonths);
    let currentIdx = ZODIAC_ORDER.indexOf(birthZodiac);
    let conceptionIdx = (currentIdx + monthShift) % 12;
    if (conceptionIdx < 0) conceptionIdx += 12;
    
    let conceptionZodiac = ZODIAC_ORDER[conceptionIdx];
    let conceptionElement = ELEMENT_MAP[conceptionZodiac];

    // แสดงผลลัพธ์โครงสร้าง Pattern 4 บรรทัด
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('patternResult').innerHTML = `
        เกิดวัน ${dayName}<br>
        ปี ${zodiacYearStr} (${lunar.phase} ${lunar.kham} ค่ำ เดือน ${lunar.thaiMonth})<br>
        ธาตุกำเนิด ${birthElement} (${birthZodiac})<br>
        ธาตุปฏิสนธิ ${conceptionElement} (${conceptionZodiac})
    `;
}
</script>
</body>
</html>
